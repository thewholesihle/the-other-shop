<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Others.| Notice The Difference</title>
  <!-- Favicon, apple-touch-icon and manifest are injected by the server from the store's own logo/favicon. -->

  <!-- Font is linked here, not via @import inside bundle.css — an @import nested in
       a stylesheet isn't discovered until that stylesheet has itself been fetched
       and parsed, adding a full serial round-trip before the real typeface even
       starts downloading. Every line of text on the site uses this font (font-sans
       and font-display both resolve to it), so that delay was the main source of
       the reported flash: body copy rendering in the fallback font, then visibly
       reflowing into Space Grotesk a beat later. Discovering it immediately, in
       parallel with bundle.css, closes most of that gap. -->
  <!-- Images and video come from Cloudinary: open that connection before the JS asks for them. -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">

  <!-- Paints the real background the instant HTML parses, before bundle.css has
       even finished downloading — otherwise a cold cache briefly shows the
       browser's plain white default first, which is its own small "flash" even
       though the stylesheet link below is render-blocking. Matches the app's
       default --background (see src/index.css); admin-configured brand colors
       still take over once site data loads, same as before. -->
  <style>
    html{background:hsl(40 20% 97%)}
    /* Static brand loading screen: painted from the first HTML byte, before any JS runs, and
       removed by the app once it has something to show (see hideBoot in src/lib/brand.js).
       The server fills in the store's real logo, name and colours. */
    #boot{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:hsl(40 20% 97%);color:hsl(30 10% 12%);font-family:var(--font-body,'Space Grotesk'),system-ui,sans-serif;transition:opacity .3s ease}
    #boot.boot-admin{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
    #boot.boot-out{opacity:0;pointer-events:none}
    #boot .boot-mark{font-size:clamp(30px,5vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1}
    #boot .boot-logo{height:40px;width:auto;max-width:220px;object-fit:contain}
    #boot .boot-track{position:relative;display:block;width:72px;height:2px;overflow:hidden;border-radius:1px}
    #boot .boot-track::before{content:'';position:absolute;inset:0;background:currentColor;opacity:.15}
    #boot .boot-track::after{content:'';position:absolute;inset:0 auto 0 0;width:40%;background:currentColor;animation:boot-slide 1.1s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){#boot .boot-track::after{animation:none;width:100%;opacity:.35}}
  </style>

  <link rel="stylesheet" href="/build/bundle.css">
</head>
<body>
  <div id="boot" style="__BOOT_STYLE__" aria-hidden="true"><!--BOOT--><span class="boot-track"></span></div>
  <script src="/build/bundle.js"></script>
</body>
</html>
